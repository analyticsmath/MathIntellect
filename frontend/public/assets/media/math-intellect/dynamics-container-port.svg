<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#E4E9E6"/>

  <!-- Terminal basin and wharf line -->
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#78807C" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="220" fill="#D3DBD7"/>

  <!-- Quay cranes and gantry rails -->
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#BAC1BD" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="0" y1="260" x2="1200" y2="260" stroke="#BAC1BD" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- High-density container stacks forming time-series regimes -->
  <g fill="#2D3330">
    <rect x="80" y="320" width="140" height="360" rx="2"/>
    <rect x="250" y="280" width="140" height="400" rx="2"/>
    <rect x="420" y="360" width="140" height="320" rx="2"/>
    <rect x="590" y="240" width="140" height="440" rx="2"/>
    <rect x="760" y="300" width="140" height="380" rx="2"/>
    <rect x="930" y="380" width="140" height="300" rx="2"/>
  </g>

  <!-- Container slot subdivision details -->
  <g fill="#3D4541" opacity="0.8">
    <rect x="90" y="330" width="120" height="40"/>
    <rect x="90" y="380" width="120" height="40"/>
    <rect x="90" y="430" width="120" height="40"/>
    <rect x="260" y="290" width="120" height="40" fill="#E35A35"/>
    <rect x="260" y="340" width="120" height="40"/>
    <rect x="600" y="250" width="120" height="40" fill="#2457E6"/>
  </g>

  <!-- AR(1) dynamics trend path connecting stack heights -->
  <path d="M 150 320 L 320 280 L 490 360 L 660 240 L 830 300 L 1000 380" stroke="#111412" stroke-width="3" fill="none"/>
  <circle cx="150" cy="320" r="5" fill="#111412"/>
  <circle cx="320" cy="280" r="5" fill="#E35A35"/>
  <circle cx="490" cy="360" r="5" fill="#111412"/>
  <circle cx="660" cy="240" r="5" fill="#2457E6"/>
  <circle cx="830" cy="300" r="5" fill="#111412"/>
  <circle cx="1000" cy="380" r="5" fill="#111412"/>
</svg>
