<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <pattern id="road-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BAC1BD" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Base landscape -->
  <rect width="1440" height="900" fill="#E6EAE8"/>
  <rect width="1440" height="900" fill="url(#road-grid)"/>

  <!-- Topography and landscape zones -->
  <path d="M 0 0 L 600 0 C 700 200 850 350 1440 400 L 1440 0 Z" fill="#DEE3E0" opacity="0.6"/>
  <path d="M 0 500 C 400 520 650 700 800 900 L 0 900 Z" fill="#D7DDD9" opacity="0.5"/>

  <!-- Complex multi-tier highway interchange system -->
  <!-- Level 0 (Ground arterials) -->
  <path d="M 0 450 Q 720 440 1440 460" stroke="#78807C" stroke-width="28" fill="none"/>
  <path d="M 720 0 Q 710 450 730 900" stroke="#78807C" stroke-width="28" fill="none"/>

  <!-- Level 1 (Flyovers and sweeping connectors) -->
  <path d="M 200 900 C 350 650 600 480 950 420 C 1200 380 1350 250 1440 150" stroke="#2D3330" stroke-width="22" fill="none"/>
  <path d="M 1240 900 C 1100 650 850 480 500 420 C 250 380 100 250 0 150" stroke="#2D3330" stroke-width="22" fill="none"/>

  <!-- Directional Ramps & Loops -->
  <path d="M 520 320 C 620 220 820 220 920 320 C 1020 420 1020 620 920 720 C 820 820 620 820 520 720 C 420 620 420 420 520 320 Z" stroke="#111412" stroke-width="16" fill="none"/>
  <path d="M 580 380 C 650 310 790 310 860 380 C 930 450 930 590 860 660 C 790 730 650 730 580 660 C 510 590 510 450 580 380 Z" stroke="#2D3330" stroke-width="14" fill="none"/>

  <!-- Center median & lane markings -->
  <path d="M 200 900 C 350 650 600 480 950 420 C 1200 380 1350 250 1440 150" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 12" fill="none" opacity="0.7"/>
  <path d="M 1240 900 C 1100 650 850 480 500 420 C 250 380 100 250 0 150" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 12" fill="none" opacity="0.7"/>

  <!-- Node points and measurement anchors -->
  <circle cx="720" cy="450" r="8" fill="#111412"/>
  <circle cx="520" cy="320" r="5" fill="#E35A35"/>
  <circle cx="920" cy="320" r="5" fill="#2457E6"/>
  <circle cx="860" cy="660" r="5" fill="#111412"/>
  <circle cx="580" cy="660" r="5" fill="#23755B"/>

  <!-- Structural vector overlay -->
  <line x1="520" y1="320" x2="920" y2="720" stroke="#E35A35" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="920" y1="320" x2="520" y2="720" stroke="#2457E6" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
</svg>
